        - APPROVE_QUESTION
        - REJECT_QUESTION
        - DELETE_QUESTION
        - UPDATE_RUBRIC
      description: Loại hành động kiểm toán MongoDB

    # ==========================================
    # Rubric & Content Schemas
    # ==========================================
    RubricCriteriaDto:
      type: object
      required:
        - name
        - description
        - weightPercent
        - orderNo
      properties:
        id:
          type: string
          example: RC_01
        name:
          type: string
          example: Khái niệm cốt lõi & Định nghĩa
        description:
          type: string
          example: Nêu chính xác định nghĩa, phân biệt được các trường hợp sử dụng.
        weightPercent:
          type: number
          format: float
          minimum: 0.01
          maximum: 100.00
          example: 40.0
          description: Trọng số % của tiêu chí
        orderNo:
          type: integer
          example: 1

    CourseRubricResponse:
      type: object
      required:
        - id
        - courseId
        - name
        - maxScore
        - isLocked
        - criteria
      properties:
        id:
          type: string
          example: RUBRIC_SWD392
        courseId:
          type: string
          example: SWD392
        name:
          type: string
          example: Rubric chuẩn môn Kiến trúc phần mềm
        description:
          type: string
          nullable: true
          example: Tiêu chí chấm thi vấn đáp học kỳ Fall 2026
        maxScore:
          type: number
          example: 10.0
        isLocked:
          type: boolean
          example: false
          description: Đã khóa khi có ca thi đang mở hoặc đã hoàn thành
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriteriaDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateCourseRubricRequest:
      type: object
