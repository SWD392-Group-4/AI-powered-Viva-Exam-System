    # ==========================================
    # Enums for Course, Rubric & Question Bank
    # ==========================================
    QuestionDifficulty:
      type: string
      enum:
        - EASY
        - MEDIUM
        - HARD
      description: Phân loại độ khó câu hỏi trực quan (thay thế thang Bloom)

    QuestionStatus:
      type: string
      enum:
        - DRAFT
        - APPROVED
        - REJECTED
        - ARCHIVED
      description: Vòng đời câu hỏi khảo thí

    QuestionSource:
      type: string
      enum:
        - MANUAL
        - AI_GENERATED
      description: Nguồn gốc câu hỏi

    MaterialRagStatus:
      type: string
      enum:
        - INDEXING
        - READY
        - FAILED
      description: Trạng thái vector embedding của học liệu

    AuditAction:
      type: string
      enum:
        - CREATE_QUESTION
        - AI_GENERATE_QUESTION
