openapi: 3.0.3
info:
  title: AIVES Authentication & Core API
  description: AI-powered Viva Exam System - Production API Contracts
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.aives.local
    description: Production Server

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user with credentials and issue token pair
      description: Validates email and password, returning an access JWT, a refresh token, and user identity profile.
      operationId: loginV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: VALIDATION_ERROR
                message: Dữ liệu gửi lên không hợp lệ
                timestamp: '2026-10-24T13:45:00Z'
                details:
                  email: Email không đúng định dạng
                  password: Mật khẩu không được để trống
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không đúng
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '403':
          description: Account disabled or restricted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: ACCOUNT_DISABLED
                message: Tài khoản đã bị khoá
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh expired access token using refresh token
      description: Validates submitted refresh token, revokes it, and issues a newly rotated access token and refresh token pair.
      operationId: refreshTokenV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token pair refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshApiResponse'
        '400':
          description: Bad request or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token invalid, expired, or already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: UNAUTHENTICATED
                message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out current user session
      description: Invalidates active access token by blacklisting its JTI and revokes associated refresh token.
      operationId: logoutV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Retrieve authenticated user profile
      description: Returns identity details of the user extracted from the JWT Bearer token claims.
      operationId: getProfileV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/send-otp:
    post:
      tags:
        - Auth
      summary: Send OTP email for candidate registration
      description: Generates a 6-digit OTP code and dispatches to specified email address with a 5-minute validity window.
      operationId: sendOtpV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register new student account with OTP verification
      description: Validates registration OTP and creates a new candidate user account with role STUDENT.
      operationId: registerStudentV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '400':
          description: Invalid OTP or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RoleName:
      type: string
      enum:
        - ADMIN
        - LECTURER
        - STUDENT
      description: System security roles matching database roles table

    TokenType:
      type: string
      enum:
        - Bearer
      description: Authentication header scheme type

    TokenLifecycleStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - REVOKED
        - ROTATED
        - INVALID
      description: Runtime lifecycle state of security tokens

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: admin@aives.local
          description: Registered account email address
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 72
          example: Admin@123
          description: Plaintext user password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Active refresh token previously issued to client

    UserResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - active
        - mustChangePassword
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[A-Z]{2}[0-9]{6}$'
          example: ST482913
          description: Unique user identifier with two-letter role prefix
        email:
          type: string
          format: email
          example: student08@fpt.edu.vn
          description: User email address
        fullName:
          type: string
          maxLength: 150
          example: Nguyễn Văn A
          description: Full display name
        role:
          $ref: '#/components/schemas/RoleName'
        active:
          type: boolean
          example: true
          description: Account activation status
        mustChangePassword:
          type: boolean
          example: false
          description: Flag requiring immediate password change on login
        studentCode:
          type: string
          nullable: true
          example: ST482913
          description: Institutional student code (present for STUDENT role)
        createdAt:
          type: string
          format: date-time
          example: '2026-10-24T08:00:00Z'
          description: Account creation UTC timestamp

    TokenRefreshResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Cryptographic JWT access token
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Newly rotated refresh token
        tokenType:
          $ref: '#/components/schemas/TokenType'
          default: Bearer
        expiresIn:
          type: integer
          example: 3600
          description: Access token lifetime in seconds
        refreshExpiresIn:
          type: integer
          example: 604800
          description: Refresh token lifetime in seconds (7 days)

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Cryptographic JWT access token
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Opaque refresh token for session renewals
        tokenType:
          $ref: '#/components/schemas/TokenType'
          default: Bearer
        expiresIn:
          type: integer
          example: 3600
          description: Access token lifetime in seconds
        refreshExpiresIn:
          type: integer
          example: 604800
          description: Refresh token lifetime in seconds
        user:
          $ref: '#/components/schemas/UserResponse'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - otpCode
      properties:
        email:
          type: string
          format: email
          example: candidate@fpt.edu.vn
        password:
          type: string
          format: password
          minLength: 6
        fullName:
          type: string
          example: Lê Hoàng Nam
        studentCode:
          type: string
          nullable: true
          example: SE170123
        otpCode:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'

    SendOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: candidate@fpt.edu.vn

    BaseApiResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: OK
        data:
          type: object
          nullable: true

    LoginApiResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: Đăng nhập thành công
        data:
          $ref: '#/components/schemas/LoginResponse'

    TokenRefreshApiResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: Làm mới token thành công
        data:
          $ref: '#/components/schemas/TokenRefreshResponse'

    UserApiResponse:
      type: object
      required:
        - success
        - code
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: OK
        message:
          type: string
          example: Thao tác thành công
        data:
          $ref: '#/components/schemas/UserResponse'

    ErrorResponse:
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
          description: Always false for error payloads
        code:
          type: string
          example: INVALID_CREDENTIALS
          description: Business domain error code matching ErrorCode enum
        message:
          type: string
          example: Email hoặc mật khẩu không đúng
          description: Human-readable error message in Vietnamese
        timestamp:
          type: string
          format: date-time
          example: '2026-10-24T13:45:00Z'
          description: UTC timestamp when the exception occurred
        details:
          type: object
          nullable: true
          additionalProperties:
            type: string
          example:
            email: Email không đúng định dạng
          description: Optional map of field validation messages or diagnostic context
