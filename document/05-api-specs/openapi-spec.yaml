openapi: 3.0.3
info:
  title: AIVES Authentication & Core API
  description: AI-powered Viva Exam System - Production API Contracts
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://api.aives.local
    description: Production Server

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate user with credentials and issue token pair
      description: Validates email and password, returning an access JWT, a refresh token, and user identity profile.
      operationId: loginV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: VALIDATION_ERROR
                message: Dữ liệu gửi lên không hợp lệ
                timestamp: '2026-10-24T13:45:00Z'
                details:
                  email: Email không đúng định dạng
                  password: Mật khẩu không được để trống
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: INVALID_CREDENTIALS
                message: Email hoặc mật khẩu không đúng
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '403':
          description: Account disabled or restricted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: ACCOUNT_DISABLED
                message: Tài khoản đã bị khoá
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh expired access token using refresh token
      description: Validates submitted refresh token, revokes it, and issues a newly rotated access token and refresh token pair.
      operationId: refreshTokenV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token pair refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshApiResponse'
        '400':
          description: Bad request or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token invalid, expired, or already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: UNAUTHENTICATED
                message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
                timestamp: '2026-10-24T13:45:00Z'
                details: null
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Log out current user session
      description: Invalidates active access token by blacklisting its JTI and revokes associated refresh token.
      operationId: logoutV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Retrieve authenticated user profile
      description: Returns identity details of the user extracted from the JWT Bearer token claims.
      operationId: getProfileV1
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/send-otp:
    post:
      tags:
        - Auth
      summary: Send OTP email for candidate registration
      description: Generates a 6-digit OTP code and dispatches to specified email address with a 5-minute validity window.
      operationId: sendOtpV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseApiResponse'
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register new student account with OTP verification
      description: Validates registration OTP and creates a new candidate user account with role STUDENT.
      operationId: registerStudentV1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '400':
          description: Invalid OTP or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # Course Rubric & Academic Content Endpoints
  # ==========================================
  /api/v1/courses/{courseId}/rubric:
    get:
      tags:
        - Course Rubric
      summary: Lấy Rubric chuẩn duy nhất của môn học
      description: Trả về bộ Rubric duy nhất của môn học kèm danh sách tiêu chí và trạng thái khóa (is_locked).
      operationId: getCourseRubric
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          description: Mã định danh môn học
      responses:
        '200':
          description: Lấy Rubric thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRubricApiResponse'
        '404':
          description: Môn học hoặc Rubric không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Course Rubric
      summary: Thiết lập hoặc cập nhật Rubric duy nhất của môn học
      description: Giảng viên cập nhật các tiêu chí Rubric của môn học. Hệ thống kiểm tra tổng trọng số bắt buộc = 100% (BR-BANK-001) và chặn cập nhật nếu Rubric đã bị khóa khi ca thi đang mở hoặc đã kết thúc (BR-BANK-006).
      operationId: updateCourseRubric
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRubricRequest'
      responses:
        '200':
          description: Cập nhật Rubric thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseRubricApiResponse'
        '400':
          description: Tổng trọng số khác 100% hoặc tiêu chí thiếu mô tả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Rubric đã bị khóa không thể chỉnh sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/courses/{courseId}/chapters:
    get:
      tags:
        - Chapters
      summary: Lấy danh sách các chương thuộc môn học
      operationId: getChaptersByCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chương
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListApiResponse'

    post:
      tags:
        - Chapters
      summary: Tạo chương mới cho môn học
      operationId: createChapter
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
      responses:
        '201':
          description: Tạo chương thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterApiResponse'

  /api/v1/chapters/{chapterId}/materials:
    get:
      tags:
        - Materials
      summary: Lấy danh sách học liệu và trạng thái RAG của chương
      operationId: getChapterMaterials
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách học liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialListApiResponse'

    post:
      tags:
        - Materials
      summary: Nạp slide/tài liệu bài giảng lên GCS và kích hoạt RAG
      description: Tải lên tài liệu (.pdf, .pptx, dung lượng <= 50MB). Hệ thống lưu trữ GCS và gửi job embedding bất đồng bộ sang Vertex AI RAG Engine (trạng thái ban đầu INDEXING).
      operationId: uploadChapterMaterial
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File slide hoặc giáo trình (PDF, PPTX)
      responses:
        '201':
          description: Tải lên thành công và đang lập chỉ mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialApiResponse'
        '400':
          description: File không đúng định dạng hoặc vượt quá 50MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/materials/{materialId}/reindex:
    post:
      tags:
        - Materials
      summary: Kích hoạt lại tiến trình lập chỉ mục RAG cho tài liệu bị lỗi
      operationId: reindexMaterial
      security:
        - bearerAuth: []
      parameters:
        - name: materialId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã kích hoạt lại tiến trình
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialApiResponse'

  # ==========================================
  # Question Bank & AI Question Generation
  # ==========================================
  /api/v1/chapters/{chapterId}/questions/generate:
    post:
      tags:
        - Question Bank
      summary: Yêu cầu AI sinh câu hỏi từ tài liệu chương theo tỷ lệ Dễ / Trung bình / Khó
      description: Gọi Vertex AI RAG Engine truy xuất các đoạn tri thức từ slide READY của chương, sinh danh sách câu hỏi DRAFT gồm nội dung, độ khó (EASY, MEDIUM, HARD), đáp án mẫu và từ khóa. TUYỆT ĐỐI KHÔNG SINH KÈM RUBRIC (BR-BANK-002, BR-BANK-004).
      operationId: generateChapterQuestions
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuestionsRequest'
      responses:
        '201':
          description: Sinh câu hỏi thành công (trạng thái DRAFT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListApiResponse'
        '400':
          description: Tỷ lệ phân bổ độ khó không bằng 100% hoặc tài liệu chưa READY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/chapters/{chapterId}/questions:
    get:
      tags:
        - Question Bank
      summary: Lấy danh sách câu hỏi trong ngân hàng dùng chung của chương
      description: Cho phép tất cả giảng viên cùng dạy môn xem câu hỏi chung theo bộ lọc trạng thái và độ khó.
      operationId: getChapterQuestions
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuestionStatus'
        - name: difficulty
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuestionDifficulty'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách câu hỏi phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListApiResponse'

    post:
      tags:
        - Question Bank
      summary: Giảng viên tự soạn câu hỏi thủ công vào ngân hàng
      operationId: createManualQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Tạo câu hỏi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionApiResponse'

  /api/v1/questions/{questionId}:
    get:
      tags:
        - Question Bank
      summary: Xem chi tiết câu hỏi
      operationId: getQuestionDetail
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chi tiết câu hỏi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionApiResponse'

    put:
      tags:
        - Question Bank
      summary: Chỉnh sửa nội dung, độ khó, đáp án mẫu, từ khóa câu hỏi
      operationId: updateQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionApiResponse'

    delete:
      tags:
        - Question Bank
      summary: Xóa câu hỏi khỏi ngân hàng
      operationId: deleteQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Xóa thành công

  /api/v1/questions/{questionId}/approve:
    patch:
      tags:
        - Question Bank
      summary: Phê duyệt câu hỏi đưa vào ngân hàng chính thức (DRAFT -> APPROVED)
      description: Kiểm tra điều kiện bất biến (BR-BANK-001) - môn học bắt buộc phải có Rubric hoàn chỉnh (tổng trọng số 100%) thì mới cho phép phê duyệt câu hỏi.
      operationId: approveQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Phê duyệt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionApiResponse'
        '400':
          description: Môn học chưa có Rubric hoàn chỉnh 100%
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/questions/{questionId}/reject:
    patch:
      tags:
        - Question Bank
      summary: Từ chối câu hỏi (DRAFT -> REJECTED)
      operationId: rejectQuestion
      security:
        - bearerAuth: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectQuestionRequest'
      responses:
        '200':
          description: Từ chối câu hỏi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionApiResponse'

  /api/v1/courses/{courseId}/audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Lấy nhật ký kiểm toán thao tác câu hỏi và rubric từ MongoDB
      description: Truy vấn lịch sử hoạt động (BR-BANK-007) đối với ngân hàng câu hỏi dùng chung và Rubric của môn học.
      operationId: getCourseAcademicAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách bản ghi audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListApiResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RoleName:
      type: string
      enum:
        - ADMIN
        - LECTURER
        - STUDENT
      description: System security roles matching database roles table

    TokenType:
      type: string
      enum:
        - Bearer
      description: Authentication header scheme type

    TokenLifecycleStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - REVOKED
        - ROTATED
        - INVALID
      description: Runtime lifecycle state of security tokens

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: admin@aives.local
          description: Registered account email address
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 72
          example: Admin@123
          description: Plaintext user password

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Active refresh token previously issued to client

    UserResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - role
        - active
        - mustChangePassword
        - createdAt
      properties:
        id:
          type: string
          pattern: '^[A-Z]{2}[0-9]{6}$'
          example: ST482913
          description: Unique user identifier with two-letter role prefix
        email:
          type: string
          format: email
          example: student08@fpt.edu.vn
          description: User email address
        fullName:
          type: string
          maxLength: 150
          example: Nguyễn Văn A
          description: Full display name
        role:
          $ref: '#/components/schemas/RoleName'
        active:
          type: boolean
          example: true
          description: Account activation status
        mustChangePassword:
          type: boolean
          example: false
          description: Flag requiring immediate password change on login
        studentCode:
          type: string
          nullable: true
          example: ST482913
          description: Institutional student code (present for STUDENT role)
        createdAt:
          type: string
          format: date-time
          example: '2026-10-24T08:00:00Z'
          description: Account creation UTC timestamp

    TokenRefreshResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Cryptographic JWT access token
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Newly rotated refresh token
        tokenType:
          $ref: '#/components/schemas/TokenType'
          default: Bearer
        expiresIn:
          type: integer
          example: 3600
          description: Access token lifetime in seconds
        refreshExpiresIn:
          type: integer
          example: 604800
          description: Refresh token lifetime in seconds (7 days)

    LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - refreshExpiresIn
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Cryptographic JWT access token
        refreshToken:
          type: string
          example: 7f8a9e0b-2c4d-4e6f-8a1b-3c5d7e9f1a2b
          description: Opaque refresh token for session renewals
        tokenType:
          $ref: '#/components/schemas/TokenType'
          default: Bearer
        expiresIn:
          type: integer
          example: 3600
          description: Access token lifetime in seconds
        refreshExpiresIn:
          type: integer
          example: 604800
          description: Refresh token lifetime in seconds
        user:
          $ref: '#/components/schemas/UserResponse'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - otpCode
      properties:
        email:
          type: string
          format: email
          example: candidate@fpt.edu.vn
        password:
          type: string
          format: password
          minLength: 6
        fullName:
